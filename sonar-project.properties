# SonarQube Cloud (sonarcloud.io) configuration
# Analysis is run from CI: see the "sonar" job in .github/workflows/ci-cd.yml
sonar.projectKey=danusigan_software-project
sonar.organization=danusigan
sonar.projectName=Software Project - OBE System
sonar.sourceEncoding=UTF-8

# --- Scope ------------------------------------------------------------------
# Monorepo: Spring Boot backend (Java) + React/Vite frontend (JS/JSX)
sonar.sources=Software-project-Backend/src/main/java,softwareproject_frontend/src
sonar.tests=Software-project-Backend/src/test/java

# Frontend tests live beside the code they test, so they are excluded from
# sources rather than declared as a test directory (a path cannot be both).
# NOTE: softwareproject_frontend/src/src/ is a stale duplicate of src/ (17 files,
# committed in 2dc3f1e). It is excluded so it does not swamp the duplication metric
# - it should be deleted from the repo.
sonar.exclusions=softwareproject_frontend/src/src/**,softwareproject_frontend/src/**/*.test.js,softwareproject_frontend/src/**/*.test.jsx,softwareproject_frontend/src/setupTests.js,**/node_modules/**,**/dist/**,**/target/**

# --- Java -------------------------------------------------------------------
sonar.java.source=17
sonar.java.binaries=Software-project-Backend/target/classes
sonar.java.test.binaries=Software-project-Backend/target/test-classes
sonar.java.libraries=Software-project-Backend/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=Software-project-Backend/target/site/jacoco/jacoco.xml

# --- JavaScript -------------------------------------------------------------
sonar.javascript.lcov.reportPaths=softwareproject_frontend/coverage/lcov.info

# --- Coverage exclusions ----------------------------------------------------
sonar.coverage.exclusions=softwareproject_frontend/src/main.jsx,Software-project-Backend/src/main/java/**/config/**,Software-project-Backend/src/main/java/**/*Application.java
