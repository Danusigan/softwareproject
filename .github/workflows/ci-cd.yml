name: CI/CD - Enterprise Grade

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Code Quality & Security Scanning
  quality-gate:
    runs-on: ubuntu-latest
    name: Code Quality & Security
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CodeQL Analysis (JavaScript)
        uses: github/codeql-action/init@v2
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  # Backend Tests
  backend:
    runs-on: ubuntu-latest
    name: Backend - Spring Boot

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Debug - Check if secrets exist
        run: |
          echo "Checking secrets configuration..."
          echo "DB_USERNAME is set: ${{ secrets.DB_USERNAME != '' }}"
          echo "DB_PASSWORD is set: ${{ secrets.DB_PASSWORD != '' }}"
          echo "DB_NAME is set: ${{ secrets.DB_NAME != '' }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h localhost -u root -p${{ secrets.DB_PASSWORD }} && break
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL is ready!"

      - name: Build & Package
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cd Software-project-Backend
          mvn clean package -DskipTests

      - name: Run Tests
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cd Software-project-Backend
          mvn test

  # Frontend Tests
  frontend:
    runs-on: ubuntu-latest
    name: Frontend - React/Vite

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: softwareproject_frontend/package-lock.json

      - name: Clean Install Dependencies
        run: |
          cd softwareproject_frontend
          rm -rf node_modules
          npm ci

      - name: Build
        run: |
          cd softwareproject_frontend
          npm run build

      - name: Run Tests
        run: |
          cd softwareproject_frontend
          npm test

  # SonarQube Cloud - static analysis + coverage for backend and frontend
  sonar:
    runs-on: ubuntu-latest
    name: SonarQube Cloud Analysis

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: Sonar needs it to detect new code and blame

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h localhost -u root -p${{ secrets.DB_PASSWORD }} && break
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Backend - build, test, JaCoCo report
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cd Software-project-Backend
          mvn -B clean verify
          # sonar.java.libraries reads target/dependency/*.jar for accurate Java rules
          mvn -B dependency:copy-dependencies -DincludeScope=test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: softwareproject_frontend/package-lock.json

      - name: Frontend - test with coverage
        run: |
          cd softwareproject_frontend
          npm ci
          npm run test:coverage

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Final Status Check
  ci-status:
    runs-on: ubuntu-latest
    name: CI Status
    needs: [backend, frontend, quality-gate, sonar]
    if: always()

    steps:
      - name: Check Pipeline Status
        run: |
          echo "✅ Backend Tests: ${{ needs.backend.result }}"
          echo "✅ Frontend Tests: ${{ needs.frontend.result }}"
          echo "✅ Code Quality: ${{ needs.quality-gate.result }}"
          echo "✅ SonarQube Cloud: ${{ needs.sonar.result }}"

          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.frontend.result }}" = "failure" ]; then
            echo "❌ Pipeline Failed"
            exit 1
          fi
          echo "✅ Pipeline Passed"

  # Build images and push to Docker Hub (main branch pushes only, after tests pass).
  # Each image is tagged with the commit SHA (what gets deployed) and latest.
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Images
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    env:
      IMAGE_NS: danusigan  # must match DOCKERHUB_NAMESPACE in deploy/docker-compose.prod.yml

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Software-project-Backend
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/lopo-backend:${{ github.sha }}
            ${{ env.IMAGE_NS }}/lopo-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./softwareproject_frontend
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/lopo-frontend:${{ github.sha }}
            ${{ env.IMAGE_NS }}/lopo-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Deploy to the AWS app server with Ansible (infra/ansible/deploy.yml).
  # SSH on the server is normally closed to everyone but the admin IP: this job logs in to AWS
  # via OIDC (no stored AWS keys), opens port 22 for its own runner IP only, deploys, and
  # always closes it again. See infra/terraform/github.tf.
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to AWS
    needs: [build-and-push]
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write  # OIDC token for AWS
    env:
      APP_HOST: ${{ vars.APP_HOST }}
      APP_SG_ID: ${{ vars.APP_SG_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: AWS login (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Open SSH for this runner only
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com)
          aws ec2 authorize-security-group-ingress --group-id "$APP_SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32,Description=github-actions-deploy}]"
          echo "RUNNER_CIDR=$RUNNER_IP/32" >> "$GITHUB_ENV"

      - name: SSH key and pinned host key
        env:
          APP_SSH_KEY: ${{ secrets.APP_SSH_KEY }}
          APP_SSH_HOST_KEY: ${{ vars.APP_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$APP_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$APP_SSH_HOST_KEY" > ~/.ssh/known_hosts
          # The new firewall rule can take a few seconds to apply.
          for i in $(seq 1 12); do
            timeout 5 bash -c "</dev/tcp/$APP_HOST/22" 2>/dev/null && exit 0
            sleep 5
          done
          echo "Port 22 on $APP_HOST not reachable" >&2; exit 1

      - name: Deploy with Ansible
        working-directory: infra/ansible
        run: |
          command -v ansible-playbook >/dev/null || pipx install ansible-core
          ansible-playbook -i "$APP_HOST," -u ubuntu --private-key ~/.ssh/id_ed25519 \
            deploy.yml -e image_tag=${{ github.sha }}

      - name: Close SSH again
        if: always() && env.RUNNER_CIDR != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$APP_SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR"
