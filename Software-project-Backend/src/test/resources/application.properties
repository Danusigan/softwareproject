# Test Configuration - MySQL Docker Container with GitHub Secrets
# This file overrides main application.properties ONLY during testing
# Credentials are injected via GitHub Secrets (not hardcoded)

# MySQL Database Connection (Docker service in CI)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test_password}

# JPA/Hibernate Configuration for Testing — Flyway (inherited from application.properties,
# spring.flyway.enabled=true) owns the schema here exactly as it does everywhere else in this
# project; ddl-auto must stay validate. create-drop made Hibernate additionally try to drop the
# schema itself on startup using auto-generated FK names from whatever the entity mappings
# looked like when ddl-auto=update last ran them, which no longer match the fixed names Flyway's
# migrations actually created — every run failed with "Can't DROP '<FK name>'; check that
# column/key exists" the moment a real MySQL was reachable (never surfaced before because this
# test could only ever reach one in CI, not in most local/dev setups).
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Must match application.properties: Flyway's schema was built assuming this strategy (a
# pass-through, no camelCase-to-snake_case conversion) - e.g. StudentMark has no explicit
# @Table name and resolves to the literal table "studentmark", not "student_mark". Without this
# line, Hibernate falls back to its own default (SpringPhysicalNamingStrategy, which does
# convert), and ddl-auto=validate fails with "missing table [student_mark]" even though the
# schema and entity mapping actually agree once the strategy matches.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Disable dev tools in tests
spring.devtools.restart.enabled=false

# JWT Configuration (required for JwtUtil bean)
jwt.secret=test-secret-key-for-ci-cd-must-be-at-least-32-characters-long

# Forgot-password email (required for EmailService/PasswordResetService beans - see
# application.properties). Mail is never actually sent in this test; only spring.mail.host
# needs to be present for MailSenderAutoConfiguration to provide a JavaMailSender bean at all.
app.frontend.url=http://localhost:5173
app.mail.from=noreply@lopoanalytics.local
spring.mail.host=localhost
spring.mail.port=587

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
