# Production profile (SPRING_PROFILES_ACTIVE=prod, set by deploy/docker-compose.prod.yml).
# Datasource, JWT secret and mail credentials come from environment variables — see
# application.properties. This file only turns down the dev-oriented verbosity there.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.security=WARN

spring.thymeleaf.cache=true
