# Active profile can be selected by the deployment environment.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database configuration. Production values are supplied through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/LOPOmapping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# NOTE: For local development you can run the application with the 'dev' profile
# which uses an embedded H2 database and does not require a running MySQL instance:
#   mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# or set the environment variable:
#   setx SPRING_PROFILES_ACTIVE dev

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Spring Data JPA
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Spring Data JPA Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server Configuration
server.port=${PORT:8080}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:2}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:100}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:20}
server.tomcat.mbeanregistry.enabled=false

# Keep the application within small free-container memory limits.
spring.main.lazy-initialization=${SPRING_MAIN_LAZY_INITIALIZATION:true}
spring.jmx.enabled=false
spring.jpa.open-in-view=false

# Keep the database pool small for Back4app's 256 MB free container.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JWT Configuration
# Required in every environment. Must contain at least 32 random characters for HS256.
jwt.secret=${JWT_SECRET}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.com.example.My.backend.of.indoor=INFO
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:WARN}

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
