# Active Spring Profile (will load application-dev.properties)
spring.profiles.active=dev

# MySQL Database Configuration — credentials must come from environment variables,
# no insecure fallback. Docker Compose supplies SPRING_DATASOURCE_* directly (higher
# precedence than this file); the 'dev' profile below supplies its own local values.
spring.datasource.url=jdbc:mysql://localhost:3306/LOPOmapping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# NOTE: For local development you can run the application with the 'dev' profile
# which uses an embedded H2 database and does not require a running MySQL instance:
#   mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# or set the environment variable:
#   setx SPRING_PROFILES_ACTIVE dev

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Spring Data JPA
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Spring Data JPA Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server Configuration
server.port=8080

# Multipart upload limits — matches FileValidationService's 5MB per-file cap; request size
# allows a little overhead for other form fields alongside the file.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Actuator - expose health only, no details (avoid leaking internals to unauthenticated callers)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT Configuration — must come from an environment variable, no insecure fallback.
# Generate with: node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
jwt.secret=${JWT_SECRET}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.example.My.backend.of.indoor=DEBUG
logging.level.org.springframework.security=DEBUG

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
